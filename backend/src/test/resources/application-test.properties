# ── Propriedades do perfil de teste ─────────────────────────────────────────
# URI sobrescrita pelo @DynamicPropertySource do BaseMongoTest (Testcontainers).
# Este valor de fallback garante que nenhum teste conecte ao Atlas acidentalmente.
spring.data.mongodb.uri=mongodb://invalid-host-tests-must-use-testcontainers:27017/biblioteca_test

# JWT fixo para testes (deve ter >= 32 chars para HS256 ser válido)
jwt.secret=lybre-test-secret-do-not-use-in-prod-key-2026
jwt.expiration-ms=3600000
