# ── Propriedades do perfil de teste ─────────────────────────────────────────
# A URI do MongoDB é sobrescrita pelo @DynamicPropertySource do BaseMongoTest
# (Testcontainers), que tem precedência superior a este arquivo.

# JWT fixo para testes (deve ter >= 32 chars para HS256 ser válido)
jwt.secret=lybre-test-secret-do-not-use-in-prod-key-2026
jwt.expiration-ms=3600000

# ViaCEP
viacep.base-url=https://viacep.com.br/ws

# Cloudinary - vazio para que CloudinaryService.configurado=false e o teste receba 503
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=