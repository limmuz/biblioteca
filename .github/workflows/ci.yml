name: CI

on:
  push:
    branches: ["principal", "main", "develop"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Dar permissão ao mvnw
        run: chmod +x mvnw

      - name: Build backend e rodar testes
        run: ./mvnw -B clean verify

      - name: Upload relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  sonarcloud:
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Dar permissão ao mvnw
        run: chmod +x mvnw

      - name: SonarCloud Scan com cobertura
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=AnaPaula2024_biblioteca \
            -Dsonar.organization=anapaula2024 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.exclusions="**/model/**,**/dto/**,**/config/**,**/repository/**,**/BibliotecaApplication.java,**/security/UserPrincipal.java,**/controller/CepController.java,**/service/ViaCepService.java" \
            -Dsonar.cpd.exclusions="**/model/**,**/dto/**"